<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>TaskFlow — задумчивый котёнок с задачами</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E5CD6"/>
      <stop offset="0.55" stop-color="#7C63E6"/>
      <stop offset="1" stop-color="#9A78F2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- хвост -->
  <path d="M384 424 q52 -2 62 34 q12 40 -34 48 q-40 8 -26 -30 q4 -18 28 -16"
        fill="#FCF3E2"/>

  <!-- тень под головой -->
  <ellipse cx="256" cy="430" rx="118" ry="24" fill="#3A2E5C" opacity="0.16"/>

  <!-- уши -->
  <polygon points="138,238 152,114 240,168" fill="#FCF3E2"/>
  <polygon points="160,204 170,152 214,172" fill="#F6A8BD"/>
  <polygon points="374,238 360,114 272,168" fill="#FCF3E2"/>
  <polygon points="352,204 342,152 298,172" fill="#F6A8BD"/>

  <!-- голова -->
  <ellipse cx="256" cy="306" rx="124" ry="110" fill="#FCF3E2"/>
  <ellipse cx="256" cy="392" rx="102" ry="48" fill="#F6E6CC" opacity="0.55"/>

  <!-- щёки -->
  <ellipse cx="172" cy="340" rx="14" ry="8" fill="#F7A7BE" opacity="0.45"/>
  <ellipse cx="340" cy="340" rx="14" ry="8" fill="#F7A7BE" opacity="0.45"/>

  <!-- глаза "задумчивые" (полузакрытые) -->
  <ellipse cx="204" cy="300" rx="28" ry="33" fill="#3A2E5C"/>
  <ellipse cx="308" cy="300" rx="28" ry="33" fill="#3A2E5C"/>
  <ellipse cx="204" cy="264" rx="38" ry="16" fill="#F6E6CC"/>
  <ellipse cx="308" cy="264" rx="38" ry="16" fill="#F6E6CC"/>
  <circle cx="197" cy="310" r="8" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="301" cy="310" r="8" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="214" cy="320" r="4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="318" cy="320" r="4" fill="#FFFFFF" opacity="0.7"/>

  <!-- усы -->
  <g stroke="#3A2E5C" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <line x1="150" y1="346" x2="82" y2="332"/>
    <line x1="148" y1="360" x2="78" y2="360"/>
    <line x1="152" y1="374" x2="88" y2="388"/>
    <line x1="362" y1="346" x2="430" y2="332"/>
    <line x1="364" y1="360" x2="434" y2="360"/>
    <line x1="360" y1="374" x2="424" y2="388"/>
  </g>

  <!-- нос и рот -->
  <polygon points="256,352 245,364 267,364" fill="#F2A3B5"/>
  <path d="M256 364 V378" stroke="#3A2E5C" stroke-width="5" fill="none" opacity="0.8"/>
  <path d="M236 384 Q245 398 257 390 Q269 398 278 384"
        stroke="#3A2E5C" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <!-- пузырёк мыслей -->
  <circle cx="86" cy="66" r="24" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="58" cy="44" r="13" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="42" cy="28" r="8" fill="#FFFFFF" opacity="0.95"/>

  <!-- карточка-задача A (справа вверху, готова) -->
  <g transform="translate(404,100) rotate(12)">
    <rect x="0" y="0" width="74" height="92" rx="16" fill="#FFF3D6"/>
    <rect x="12" y="12" width="28" height="8" rx="4" fill="#EFBE62"/>
    <circle cx="24" cy="50" r="13" fill="#3ECF8E"/>
    <path d="M18 50 l4 5 l8 -9" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="47" width="18" height="5" rx="2.5" fill="#C9B37F" opacity="0.8"/>
    <rect x="12" y="74" width="50" height="5" rx="2.5" fill="#DCC9A0" opacity="0.7"/>
  </g>

  <!-- карточка-задача B (слева внизу, новая) -->
  <g transform="translate(36,376) rotate(-10)">
    <rect x="0" y="0" width="78" height="94" rx="16" fill="#E4F6FF"/>
    <rect x="12" y="12" width="34" height="8" rx="4" fill="#8FC9EF"/>
    <circle cx="24" cy="52" r="13" fill="none" stroke="#35A0E7" stroke-width="6"/>
    <rect x="46" y="49" width="20" height="5" rx="2.5" fill="#9FC9E8" opacity="0.8"/>
    <rect x="12" y="78" width="54" height="5" rx="2.5" fill="#BBD9EF" opacity="0.7"/>
  </g>

  <!-- карточка-задача C (слева вверху) -->
  <g transform="translate(32,150) rotate(-12)">
    <rect x="0" y="0" width="66" height="84" rx="14" fill="#FFE7F0"/>
    <rect x="10" y="10" width="26" height="8" rx="4" fill="#F2A8C0"/>
    <circle cx="20" cy="46" r="12" fill="#F58FB6"/>
    <path d="M15 46 l4 5 l7 -8" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="43" width="16" height="5" rx="2.5" fill="#E6A5BC" opacity="0.8"/>
    <rect x="10" y="68" width="46" height="5" rx="2.5" fill="#F0C6D6" opacity="0.7"/>
  </g>

  <!-- карточка-задача D (справа внизу) -->
  <g transform="translate(418,360) rotate(16)">
    <rect x="0" y="0" width="56" height="70" rx="12" fill="#F1E9FF"/>
    <circle cx="18" cy="42" r="11" fill="#8F6BDB"/>
    <path d="M13 42 l4 5 l7 -8" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="10" y="18" width="22" height="6" rx="3" fill="#C6B4EA" opacity="0.8"/>
  </g>
</svg>